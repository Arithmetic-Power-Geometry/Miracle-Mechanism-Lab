name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Streamlit syntax check
        run: python -m py_compile streamlit_app.py streamlit_21.py
      - name: Generate CTC reproducibility artifacts
        run: python -m scripts.generate_ctc_artifacts
      - name: Verify CTC artifact manifest
        run: python -m scripts.verify_ctc_artifacts
      - name: Generate synthetic benchmark
        run: python -m scripts.generate_dataset
      - name: Audit dataset
        run: python -m scripts.audit_dataset
      - name: Constraint inversion
        run: python -m scripts.run_inversion
      - name: Mechanism clustering
        run: python -m scripts.analyze_mechanism_clusters
      - name: Minimal mechanism basis
        run: python -m scripts.find_minimal_basis
      - name: SWEET-1 benchmark
        run: python -m scripts.run_sweet1
      - name: SWEET-1 minimum measurements
        run: python -m scripts.analyze_sweet1_separation
      - name: SWEET-1 anomaly analysis
        run: python -m scripts.analyze_sweet1_anomaly
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miracle-mechanism-audit
          path: artifacts/
