name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic benchmark
        run: python scripts/generate_dataset.py
      - name: Audit dataset
        run: python scripts/audit_dataset.py
      - name: Constraint inversion
        run: python scripts/run_inversion.py
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: miracle-mechanism-audit
          path: artifacts/
